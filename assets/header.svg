<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- terminal window -->
  <rect x="1" y="1" width="818" height="298" rx="12" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="28" cy="21" r="6.5" fill="#3d3d3d"/>
  <circle cx="50" cy="21" r="6.5" fill="#5a5a5a"/>
  <circle cx="72" cy="21" r="6.5" fill="#787878"/>
  <text x="410" y="26" text-anchor="middle" fill="#5c5c5c" font-size="13">je1al@security: ~/profile</text>
  <line x1="1" y1="41" x2="819" y2="41" stroke="#222" stroke-width="1"/>

  <!-- whoami command (typed) -->
  <g>
    <text x="28" y="86" font-size="18"><tspan fill="#6e7681">$ </tspan><tspan fill="#f0f0f0">whoami</tspan></text>
    <rect x="28" y="70" width="130" height="26" fill="#0d0d0d">
      <animate attributeName="x" from="28" to="158" begin="0.4s" dur="0.6s" fill="freeze"/>
      <animate attributeName="width" from="130" to="0" begin="0.4s" dur="0.6s" fill="freeze"/>
    </rect>
  </g>
  <text x="28" y="118" font-size="19" letter-spacing="0.3" opacity="0">
    <tspan fill="#ffffff" font-weight="700">Jelaletdin Seytjanov</tspan><tspan fill="#8b8b8b"> &#8212; Cybersecurity Engineer</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.4s" fill="freeze"/>
  </text>

  <!-- focus command (typed) -->
  <g>
    <text x="28" y="162" font-size="18"><tspan fill="#6e7681">$ </tspan><tspan fill="#f0f0f0">cat focus.txt</tspan></text>
    <rect x="28" y="146" width="185" height="26" fill="#0d0d0d">
      <animate attributeName="x" from="28" to="213" begin="1.7s" dur="0.6s" fill="freeze"/>
      <animate attributeName="width" from="185" to="0" begin="1.7s" dur="0.6s" fill="freeze"/>
    </rect>
  </g>
  <text x="28" y="194" font-size="16" fill="#b3b3b3" opacity="0">
    applied cryptography &#183; network security &#183; embedded / IoT security
    <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.4s" fill="freeze"/>
  </text>

  <!-- status command (typed) -->
  <g>
    <text x="28" y="238" font-size="18"><tspan fill="#6e7681">$ </tspan><tspan fill="#f0f0f0">./status --now</tspan></text>
    <rect x="28" y="222" width="200" height="26" fill="#0d0d0d">
      <animate attributeName="x" from="28" to="228" begin="3.0s" dur="0.6s" fill="freeze"/>
      <animate attributeName="width" from="200" to="0" begin="3.0s" dur="0.6s" fill="freeze"/>
    </rect>
  </g>
  <text x="28" y="270" font-size="16" fill="#b3b3b3" opacity="0">
    building security tooling &#183; learning offensive security<tspan fill="#f0f0f0" font-weight="700">&#160;&#9611;<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="1.06s" calcMode="discrete" begin="4s" repeatCount="indefinite"/></tspan>
    <animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.4s" fill="freeze"/>
  </text>
</svg>
