name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (monochrome)
        uses: Platane/snk@v3
        id: snake-gen
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#1a1a1a&color_dots=#ebebeb,#bdbdbd,#8a8a8a,#5c5c5c,#1a1a1a
            dist/snake-dark.svg?palette=github-dark&color_snake=#e8e8e8&color_dots=#161616,#3a3a3a,#5c5c5c,#8a8a8a,#e8e8e8

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
